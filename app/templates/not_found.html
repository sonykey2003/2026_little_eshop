<!-- Shown when somebody asks for a product or order that does not exist. -->
{% extends "base.html" %}

{% block title %}Not found - {{ shop_name }}{% endblock %}

{% block content %}
  <h1>We could not find that</h1>
  <p>The page you asked for is not here. It may have sold out, or the
     address may have a typo in it.</p>
  <a class="button" href="{{ url_for('home') }}">Back to the shop</a>
{% endblock %}
